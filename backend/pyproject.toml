[project]
name = "opticore-backend"
version = "0.1.0"
requires-python = ">=3.12"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
filterwarnings = [
    # Our own code must not use deprecated APIs; third-party deprecations are only reported.
    "error::DeprecationWarning:app",
    "error::DeprecationWarning:tests",
    # ezdxf still calls old pyparsing names (third-party, harmless).
    "ignore::DeprecationWarning:ezdxf",
    "ignore::DeprecationWarning:pyparsing",
]

[tool.coverage.run]
source = ["app"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 120
target-version = "py312"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E", "W", "F",   # pycodestyle, pyflakes
    "I",             # import order
    "N",             # naming
    "UP",            # modern syntax for 3.12
    "B",             # bugbear
    "C4",            # comprehensions
    "SIM",           # simplifications
    "PTH",           # pathlib
    "RET",           # return statements
    "FAST",          # FastAPI best practices
    "RUF",
]
ignore = [
    "RUF001", "RUF002", "RUF003",  # Arabic text and typographic characters are intentional
    "FAST003",  # path params are read by dependencies (ProjectDep / ProjectFileDep), which this rule cannot see
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["N802"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["alembic/versions/"]

[[tool.mypy.overrides]]
# Libraries without type information.
module = ["shapely.*", "geoalchemy2.*", "ezdxf.*", "pyproj.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Tests read JSON responses (typed Any) — allow returning them without casts.
module = ["tests.*"]
warn_return_any = false
